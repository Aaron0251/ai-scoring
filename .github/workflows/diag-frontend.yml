name: Diag Frontend

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/93282270217/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-sa@h000-500602.iam.gserviceaccount.com"

      - name: Re-enable default URL on frontend service
        run: |
          echo "===== 啟用 default URL ====="
          gcloud run services update ai-scoring-frontend \
            --region=asia-east1 --project=h000-500602 \
            --default-url
          echo "===== 修復後 status.url ====="
          gcloud run services describe ai-scoring-frontend \
            --region=asia-east1 --project=h000-500602 \
            --format="value(status.url)"
